<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KML Map Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
    .layer-selector {
      background: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      max-height: 80vh;
      overflow-y: auto;
    }
    .layer-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: 600 14px/1.2 inherit;
      font-family: inherit;
      cursor: pointer;
    }
    .layer-caret {
      font-size: 11px;
      opacity: 0.6;
    }
    .layer-list {
      margin-top: 8px;
    }
    .layer-list[hidden] {
      display: none;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      cursor: pointer;
    }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .layer-row label {
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .locate-control a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .locate-control a.locating {
      color: #2a7ae2;
    }
    .error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .error-overlay .error-message {
      background: #fff;
      padding: 24px 32px;
      border-radius: 8px;
      font-size: 16px;
      color: #c0392b;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      max-width: 400px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 10000;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>
  <script>
    var map = L.map('map').setView([40.7, -74.0], 10);

    // CARTO requires an API key on basemaps.cartocdn.com; without one the
    // tiles still load but carry an "API KEY REQUIRED" watermark. The
    // placeholder below is substituted at deploy time from the CARTO_KEY CI
    // variable, so the key stays out of the repo. Left unsubstituted when
    // opening this file locally, which just means a watermarked basemap.
    var CARTO_KEY = 'cb1_2y0t_1_1acce75ebb404437ab30e9b0';
    var cartoTiles = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
    if (CARTO_KEY && CARTO_KEY !== '__CARTO' + '_KEY__') {
      cartoTiles += '?key=' + CARTO_KEY;
    }

    L.tileLayer(cartoTiles, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    function showError(message) {
      var overlay = document.createElement('div');
      overlay.className = 'error-overlay';
      var msg = document.createElement('div');
      msg.className = 'error-message';
      msg.textContent = message;
      overlay.appendChild(msg);
      document.body.appendChild(overlay);
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      requestAnimationFrame(function() {
        toast.classList.add('visible');
      });
      setTimeout(function() {
        toast.classList.remove('visible');
        setTimeout(function() {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 3000);
    }

    var COLOR_PALETTE = [
      '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4',
      '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990'
    ];

    // Checked on first load when the URL does not name any layers.
    var DEFAULT_LAYERS = ['food_USA', 'activities_USA'];

    var layers = {};

    function fetchManifest() {
      return fetch('files.json')
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
    }

    function loadKml(filename, colorIndex) {
      var color = COLOR_PALETTE[colorIndex % COLOR_PALETTE.length];
      var customLayer = L.geoJson(null, {
        pointToLayer: function(feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 8,
            fillColor: color,
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
          });
        },
        onEachFeature: function(feature, layer) {
          var props = feature.properties || {};
          var name = props.name || '';
          var description = props.description || '';
          var div = document.createElement('div');
          div.className = 'popup-content';
          var h3 = document.createElement('h3');
          h3.textContent = name;
          div.appendChild(h3);
          var p = document.createElement('p');
          p.style.whiteSpace = 'pre-line';
          p.textContent = description;
          div.appendChild(p);
          layer.bindPopup(div, { maxWidth: 350 });
        }
      });
      var kmlLayer = omnivore.kml(filename, null, customLayer)
        .on('error', function() {
          showToast('Failed to load ' + filename);
        })
        .addTo(map);
      layers[filename] = kmlLayer;
      return kmlLayer;
    }

    function removeKml(filename) {
      if (layers[filename]) {
        map.removeLayer(layers[filename]);
        delete layers[filename];
      }
    }

    function formatLabel(filename) {
      return filename
        .replace(/\.kml$/, '')
        .replace(/_/g, ' - ')
        .replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    }

    function getSelectedFromUrl() {
      var params = new URLSearchParams(window.location.search);
      var filesParam = params.get('files');
      if (!filesParam) return [];
      return filesParam.split(',').filter(function(s) { return s.length > 0; });
    }

    function updateUrl(selectedStems) {
      var params = new URLSearchParams(window.location.search);
      if (selectedStems.length > 0) {
        params.set('files', selectedStems.join(','));
      } else {
        params.delete('files');
      }
      var newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      history.replaceState(null, '', newUrl);
    }

    function getSelectedStems() {
      var stems = [];
      Object.keys(layers).forEach(function(filename) {
        stems.push(filename.replace(/\.kml$/, ''));
      });
      return stems;
    }

    function fitToVisibleLayers() {
      var allBounds = [];
      Object.keys(layers).forEach(function(key) {
        var bounds = layers[key].getBounds();
        if (bounds.isValid()) {
          allBounds.push(bounds);
        }
      });
      if (allBounds.length > 0) {
        var combined = allBounds[0];
        for (var i = 1; i < allBounds.length; i++) {
          combined.extend(allBounds[i]);
        }
        map.fitBounds(combined, { padding: [30, 30] });
      }
    }

    var LayerSelector = L.Control.extend({
      options: { position: 'topright' },
      initialize: function(files, opts) {
        L.setOptions(this, opts);
        this._files = files;
      },
      onAdd: function() {
        var container = L.DomUtil.create('div', 'layer-selector');
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        var toggle = L.DomUtil.create('button', 'layer-toggle', container);
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', 'false');
        var toggleText = L.DomUtil.create('span', '', toggle);
        var caret = L.DomUtil.create('span', 'layer-caret', toggle);
        caret.textContent = '\u25B8';

        // Collapsed on load. The header keeps the checked count so the closed
        // panel still says how much is on the map.
        var list = L.DomUtil.create('div', 'layer-list', container);
        list.hidden = true;

        function refreshCount() {
          var checked = list.querySelectorAll('input[type="checkbox"]:checked');
          toggleText.textContent = 'Layers (' + checked.length + ')';
        }

        toggle.addEventListener('click', function() {
          var expand = list.hidden;
          list.hidden = !expand;
          toggle.setAttribute('aria-expanded', expand ? 'true' : 'false');
          caret.textContent = expand ? '\u25BE' : '\u25B8';
        });

        this._files.forEach(function(filename, idx) {
          var color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
          var row = L.DomUtil.create('div', 'layer-row', list);
          var swatch = L.DomUtil.create('span', 'color-swatch', row);
          swatch.style.backgroundColor = color;
          var cb = L.DomUtil.create('input', '', row);
          cb.type = 'checkbox';
          cb.value = filename;
          cb.id = 'layer-' + idx;
          var label = L.DomUtil.create('label', '', row);
          label.htmlFor = cb.id;
          label.textContent = formatLabel(filename);
          cb.addEventListener('change', function() {
            if (cb.checked) {
              loadKml(filename, idx);
            } else {
              removeKml(filename);
            }
            refreshCount();
            updateUrl(getSelectedStems());
          });
        });

        refreshCount();
        this.refreshCount = refreshCount;
        this._container = container;
        return container;
      }
    });

    var locationMarker = null;
    var locationCircle = null;
    var locateLink = null;

    function locationErrorMessage(err) {
      // Codes mirror the W3C GeolocationPositionError values.
      if (err.code === 1) return 'Location permission denied';
      if (err.code === 2) return 'Location unavailable';
      if (err.code === 3) return 'Location request timed out';
      return err.message || 'Could not determine your location';
    }

    map.on('locationfound', function(e) {
      if (locateLink) locateLink.classList.remove('locating');
      if (locationMarker) {
        locationMarker.setLatLng(e.latlng);
        locationCircle.setLatLng(e.latlng);
        locationCircle.setRadius(e.accuracy);
      } else {
        locationCircle = L.circle(e.latlng, {
          radius: e.accuracy,
          color: '#2a7ae2',
          weight: 1,
          fillColor: '#2a7ae2',
          fillOpacity: 0.12
        }).addTo(map);
        locationMarker = L.circleMarker(e.latlng, {
          radius: 7,
          fillColor: '#2a7ae2',
          color: '#fff',
          weight: 3,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);
      }
      locationMarker.bindPopup('You are here (\u00B1' + Math.round(e.accuracy) + ' m)');
    });

    map.on('locationerror', function(e) {
      if (locateLink) locateLink.classList.remove('locating');
      showToast(locationErrorMessage(e));
    });

    var LocateControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        var container = L.DomUtil.create('div', 'leaflet-bar locate-control');
        var link = L.DomUtil.create('a', '', container);
        link.href = '#';
        link.title = 'Show my location';
        link.setAttribute('role', 'button');
        link.setAttribute('aria-label', 'Show my location');
        link.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">' +
          '<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>' +
          '<line x1="12" y1="1" x2="12" y2="5.5" stroke="currentColor" stroke-width="2"/>' +
          '<line x1="12" y1="18.5" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>' +
          '<line x1="1" y1="12" x2="5.5" y2="12" stroke="currentColor" stroke-width="2"/>' +
          '<line x1="18.5" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>' +
          '</svg>';
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.on(link, 'click', L.DomEvent.stop);
        L.DomEvent.on(link, 'click', function() {
          // Browsers only expose geolocation over HTTPS or on localhost; from
          // a file:// page this reports an error rather than a position.
          if (!navigator.geolocation) {
            showToast('Geolocation is not supported by this browser');
            return;
          }
          link.classList.add('locating');
          map.locate({
            setView: true,
            maxZoom: 15,
            enableHighAccuracy: true,
            timeout: 10000
          });
        });
        locateLink = link;
        return container;
      }
    });

    fetchManifest().then(function(files) {
      if (!files || files.length === 0) {
        showError('No KML files available');
        return;
      }

      var selector = new LayerSelector(files);
      selector.addTo(map);
      new LocateControl().addTo(map);

      // An explicit ?files= always wins, so shared links keep working. The
      // defaults only fill in when the URL names nothing, and are filtered
      // against the manifest so an unbuilt layer is skipped, not fetched.
      var urlStems = getSelectedFromUrl();
      var stems = urlStems.length > 0 ? urlStems : DEFAULT_LAYERS.filter(function(stem) {
        return files.indexOf(stem + '.kml') !== -1;
      });

      if (stems.length > 0) {
        var loadPromises = [];
        files.forEach(function(filename, idx) {
          var stem = filename.replace(/\.kml$/, '');
          if (stems.indexOf(stem) !== -1) {
            var cb = document.getElementById('layer-' + idx);
            if (cb) cb.checked = true;
            var kmlLayer = loadKml(filename, idx);
            loadPromises.push(new Promise(function(resolve) {
              kmlLayer.on('ready', resolve);
              kmlLayer.on('error', resolve);
            }));
          }
        });
        selector.refreshCount();
        Promise.all(loadPromises).then(function() {
          fitToVisibleLayers();
        });
      }
    }).catch(function() {
      showError('Could not load file list');
    });
  </script>
</body>
</html>
